name: NeverDrop
options:
  bundleIdPrefix: com.draftnrun
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.40"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit.git
    from: "0.12.0"

targets:
  NeverDrop:
    type: application
    platform: macOS
    sources:
      - NeverDrop
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.draftnrun.NeverDrop
        PRODUCT_NAME: NeverDrop
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        INFOPLIST_FILE: NeverDrop/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NeverDrop/Resources/NeverDrop.entitlements
        ENABLE_APP_SANDBOX: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WhisperKit
    entitlements:
      path: NeverDrop/Resources/NeverDrop.entitlements

  NeverDropTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NeverDropTests
    dependencies:
      - target: NeverDrop
    settings:
      base:
        SWIFT_VERSION: "5"
